name: stylesense-platform
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set a database name}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
